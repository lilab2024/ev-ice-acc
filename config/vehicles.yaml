# ICE: vehicle code in raw file names -> name used in the paper
# VehC is a hybrid and is excluded; the remaining vehicles are renumbered in the paper.
# run_ids keep the raw code: ICE_VehD_* is VehC in the paper, ICE_VehG_* is VehF.
ice:
  A: {paper_name: VehA}
  B: {paper_name: VehB}
  C: {paper_name: null, exclude: true, reason: hybrid powertrain}
  D: {paper_name: VehC}
  E: {paper_name: VehD}
  F: {paper_name: VehE}
  G: {paper_name: VehF}

# EV: folder name in the raw data (must match exactly) -> name used in the paper.
# run_ids keep the folder name: EV_Tesla_* is Model 3, EV_Polestar_* is Polestar 2.
ev:
  "Hyundai Ioniq 5": {paper_name: IONIQ 5}
  "Tesla":           {paper_name: Model 3}
  "Polestar":        {paper_name: Polestar 2}
